name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Codex plugin
        run: npm run smoke
      - name: Test ZCode plugin
        run: npm test
        working-directory: zcode-codex-bridge/plugin
